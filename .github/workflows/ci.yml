name: Service checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Backend regression and business requirements
        working-directory: backend
        run: |
          python -m unittest discover -s tests -v
          python -m tests.validate_must_have
      - name: Real HTTP, separate worker, access and Excel
        run: python qa/smoke_service.py
      - name: Frontend tests, lint and production build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
      - name: Linux configuration syntax
        run: |
          sudo apt-get update
          sudo apt-get install --yes nginx openssl
          sudo --preserve-env=PATH python qa/check_linux_deploy.py
