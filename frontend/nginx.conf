# nginx отдаёт собранный фронт и проксирует /api на backend-сервис.
server {
    listen 80;

    # API → сервис backend в сети docker-compose.
    location /api/ {
        proxy_pass http://backend:8017;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;   # полный расчёт на 250k строк ~20-30с
    }

    # Статика + SPA-фолбэк.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
