upstream umytpa_api {
    server 127.0.0.1:8017;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    server_tokens off;
    root /opt/umytpa/frontend/dist;
    index index.html;
    ssl_certificate /etc/umytpa/tls/fullchain.pem;
    ssl_certificate_key /etc/umytpa/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # The API emits structured request-id logs. Do not retain URLs/query values here.
    access_log off;
    error_log /dev/stderr warn;

    location /api/ {
        proxy_pass http://umytpa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 620s;
        proxy_send_timeout 30s;
        # Preserve API Cache-Control: no-store. Do not add headers in this block:
        # nginx would drop the security headers inherited from the server block.
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
